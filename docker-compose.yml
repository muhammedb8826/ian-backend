version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ian-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mame
      MYSQL_DATABASE: ian_backend
      MYSQL_USER: root
      MYSQL_PASSWORD: mame
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data: